<!doctype html>
<html lang="en" data-suite-module="vocabulary-test" data-lexical-theme="ivory">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F5F1E8">
  <title>Test · LexicalSpace</title>
  <script src="../../suite/js/core.js?v=44.3.0-190dbe27a9"></script><script src="../../js/features/appearance.js?v=44.3.0-600e490765"></script>
  <link rel="manifest" href="../../manifest.webmanifest"><link rel="apple-touch-icon" href="../../assets/icons/icon-192.png">
  <link rel="stylesheet" href="./css/exam.css?v=44.3.0-ef24d1548e"><script defer src="../../js/core/offline.js?v=44.3.0-39c886b7ac"></script><script defer src="./js/exam.js?v=44.3.0-08c18b620b"></script>
</head>
<body>
  <div class="shell">
    <header class="header">
      <a class="back" href="../arcade/" data-suite-return>← Arcade Hub</a>
      <div class="brand"><h1>Test</h1><span id="examCodeDisplay" class="exam-code">Bộ 1 · B2/C1</span></div>
      <div class="header-actions">
        <div class="timer" id="timerBox" aria-label="Time remaining"><strong id="timerDigits" aria-live="off">15:00</strong></div>
        <label class="upload">📁 Nạp đề<input id="jsonFileInput" type="file" accept=".json,application/json"></label>
      </div>
    </header>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="set-selector" role="group" aria-label="Bộ đề"><span>Bộ đề:</span><button type="button" data-question-set="0" aria-pressed="false" disabled>Bộ 1</button><button type="button" data-question-set="1" aria-pressed="false" disabled>Bộ 2</button><button type="button" data-question-set="2" aria-pressed="false" disabled>Bộ 3</button><button type="button" data-question-set="3" aria-pressed="false" disabled>Bộ 4</button><button type="button" data-question-set="4" aria-pressed="false" disabled>Bộ 5</button></div>
    <main class="exam-main">
      <article class="question-card" aria-labelledby="qPromptText">
        <div class="palette-strip"><div id="paletteGrid" class="palette" aria-label="Question navigation"></div><strong id="answeredRatioText" aria-label="Questions answered">0/10</strong></div>
        <div class="question-top"><div class="tags"><span class="number" id="qNumberTag">Câu 1/10</span><span class="badge" id="qLevelTag">B2/C1</span><span id="qTopicTag">Academic Vocabulary</span></div><button class="flag" id="btnFlagQuestion" type="button" aria-pressed="false">⚑ <span id="flagBtnText">Flag for review</span></button></div>
        <h2 id="qPromptText">Loading questions…</h2><p id="qContextBox" class="context" hidden></p><div id="optionsGrid" class="options" role="group" aria-label="Answer choices"></div>
        <div class="card-nav"><button id="btnPrevQ" class="secondary" type="button">← Câu trước</button><button id="btnNextQ" class="secondary" type="button">Câu tiếp →</button><button id="btnOpenSubmitModal" class="primary" type="button">Nộp bài thi</button></div>
      </article>
    </main>
  </div>
  <dialog id="submitModal" aria-labelledby="submitTitle"><h2 id="submitTitle">Submit your test?</h2><p id="submitWarningMsg"></p><div class="modal-actions"><button id="btnCancelSubmit" class="secondary" type="button">Keep working</button><button id="btnConfirmFinalSubmit" class="primary" type="button">Submit and see results</button></div></dialog>
  <dialog id="resultModal" class="result-dialog" aria-labelledby="resultTitle"><div class="result-header"><h2 id="resultTitle">Your scorecard</h2><p id="resultFeedbackText"></p></div><div class="score-summary"><div><span>Correct</span><strong id="resScoreVal"></strong></div><div><span>Accuracy</span><strong id="resPercentVal"></strong></div><div><span>Time taken</span><strong id="resTimeVal"></strong></div><div><span>Unanswered</span><strong id="resUnansweredVal"></strong></div></div><h3>Question review</h3><p class="review-intro">Review every answer and its explanation.</p><div id="reviewListContainer" class="review-list"></div><div class="modal-actions"><a href="../arcade/" data-suite-return class="secondary">Arcade Hub</a><button id="btnRestartExam" class="primary" type="button">Try again</button></div></dialog>
</body></html>
