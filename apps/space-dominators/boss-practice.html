<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Dominators — Boss Lab</title><link rel="stylesheet" href="./station.css?v=44.50.0-a6769099a1">
<style>
#lab{position:relative;z-index:2;width:min(94vw,520px);margin:18px auto;padding:20px;background:#101f2f;text-align:left}#lab label{display:grid;gap:.3rem;margin:.8rem 0;color:var(--muted)}
#lab select{font:inherit;padding:.55rem;background:#101f2f;color:inherit;border:1px solid var(--line);border-radius:5px}
#lab nav{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}#lab a{color:var(--mint)}
.intel{display:flex;align-items:center;gap:1rem}.intel canvas{width:110px;image-rendering:pixelated}.setup{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.links{margin:1rem 0}#lab{max-height:92dvh;overflow:auto}#lab nav{margin:.7rem 0}#skillFrames{display:block;max-width:100%;image-rendering:pixelated}#skillFrames[hidden]{display:none}#lab.fleet-study :is(#resume,#rush){display:none}</style><script src="../../suite/js/effects-volume.js?v=44.50.0-ddd24e7a19"></script><script defer src="../../suite/js/game-menu-audio.js?v=44.50.0-a1553843c3"></script></head>
<body>
<section id="mission"><canvas id="flight" width="1280" height="720" tabindex="0" aria-label="Boss practice arena"></canvas><button id="pause" aria-label="Pause practice">Ⅱ</button></section>
<section id="lab" aria-labelledby="title"><h2 id="title">Boss Lab</h2>
<p id="status" role="status">Choose an encounter. Campaign progress and credits are separate.</p>
<div class="intel"><canvas id="bossPreview" width="152" height="152" aria-label="Boss silhouette"></canvas><div><strong id="moveName"></strong><p id="intel"></p><small id="cadence"></small></div></div>
<label>Encounter<select id="encounter"></select></label>
<div class="setup" data-combat><label>Starting phase<select id="phase"></select></label>
<label>Cannon level<select id="level"><option>I</option><option>II</option><option>III</option><option>IV</option><option>V</option><option>VI</option><option>VII</option><option>VIII</option></select></label></div>
<label data-combat>Practice pattern<select id="skill"><option value="">Full encounter</option></select></label><small id="skillBrief" data-combat></small><canvas hidden id="skillFrames" width="256" height="64" aria-label="Four animation frames of the selected skill"></canvas>
<label data-combat>Spacecraft<select id="craft"><option value="kestrel">Kestrel</option><option value="spectre">Spectre</option><option value="aegis">Aegis</option><option value="tempest">Tempest</option></select></label>
<label>Effects volume<input id="labVolume" type="range" min="0" max="100" value="50"></label><button id="labMute" type="button" aria-label="Mute effects" aria-pressed="false">🔊</button>
<nav><button id="start" class="primary" disabled>Start encounter</button><button id="previewFive" hidden>Preview hyperspace fleet</button><button id="previewSix" hidden disabled>Preview giant warship</button><button id="previewFinale" hidden disabled>Test reactor finale</button><button id="resume" hidden>Resume</button><button id="rush" hidden>Boss Rush</button></nav><div class="links" data-combat><a id="wingmate" href="./index.html">Practice with a wingmate</a></div>
<p data-combat>WASD or mouse to fly · Space to fire · E for skill</p><a data-carry-deck href="./index.html">Return to hangar</a></section>
<script src="./art.js"></script><script src="../../suite/js/core.js?v=44.50.0-a5b98868bd"></script><script src="../arcade/assets/lexical-vocabulary.js"></script><script src="./words.js"></script><script src="./sfx-config.js?v=44.50.0-f326aea785"></script><script src="./sound.js?v=44.50.0-6c06c0c734"></script><script src="./background.js?v=44.50.0-08238a87e7"></script><script src="./capital-art.js"></script><script src="./campaign-sprites.js"></script><script src="./boss-fx.js"></script><script src="./dreadnought-config.js?v=44.50.0-a7d7b25b7e"></script><script src="./dreadnought-ending.js?v=44.50.0-684a050362"></script><script src="./dreadnought-formations.js?v=44.50.0-f0fff698d9"></script><script src="./dreadnought.js?v=44.50.0-3248af9473"></script><script src="./boss-encounters.js?v=44.50.0-f058aea627"></script><script src="./miner-art.js"></script><script src="./asteroid-belt.js?v=44.50.0-5d4a5b3555"></script><script src="./boss-campaign.js?v=44.50.0-7b9cecb0c5"></script><script src="./fleet-arrival.js?v=44.50.0-e82172afe9"></script><script src="./dock-nine-story.js?v=44.50.0-afb4d8a77b"></script><script src="./fleet-study.js?v=44.50.0-be22d2091d"></script><script src="./game.js?v=44.50.0-e8e1ad018b"></script><script src="./boss-six-preview.js?v=44.50.0-16eedb6c55"></script><script src="./boss-practice.js?v=44.50.0-9074821351"></script>
</body></html>
