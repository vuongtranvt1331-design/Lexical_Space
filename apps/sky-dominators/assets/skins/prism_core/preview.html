<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Flame / Prism Core — 40-frame preview</title>
<style>body{margin:0;background:#10121b;color:#fff2dc;font:16px system-ui;display:grid;place-items:center;min-height:100vh}main{width:min(90vw,520px);padding:24px;text-align:center}h1{font-size:24px}#stage{border-radius:12px;background:#202735;margin:20px 0;display:grid;place-items:center;min-height:300px}#stage.light{background:#e8e9ee}canvas{width:min(100%,520px);height:auto;image-rendering:pixelated}button{font:inherit;background:#542713;color:#fff2dc;border:1px solid #d48949;border-radius:8px;padding:12px;margin:4px;cursor:pointer}input{width:90%}p{line-height:1.5;color:#d3c4b9}a{color:#ffc27a}</style>
<script defer src="js/config/skins/prism-core-config.js?v=2026-11-04-prism-core-gothic-1"></script><script defer src="js/entities/skins/prism-core.js?v=2026-11-04-prism-core-gothic-1"></script>
</head><body><main><h1>Flame / Prism Core</h1><p>Chronos · 40 frames · 4 FPS · 10-second loop</p><div id="stage"><canvas id="preview" width="416" height="416" aria-label="Animated Chronos fire skin"></canvas></div><output id="status">Loading artwork…</output><p><button id="play">Pause</button><button id="background">Light background</button></p><input id="frame" type="range" min="0" max="39" value="0" aria-label="Inspect frame"><p>Idle and movement share the same uninterrupted animation. This preview changes no player data.</p><a href="boss-test.html">Test in game</a></main>
<script>addEventListener('DOMContentLoaded',async()=>{const api=SkyPrismCore,c=new api.AnimationController(),ctx=document.getElementById('preview').getContext('2d'),slider=document.getElementById('frame'),status=document.getElementById('status'),play=document.getElementById('play');let playing=true,last=performance.now(),shown=-1;try{await api.preload();}catch(e){status.textContent=e.message;return;}function draw(){if(shown===c.frame)return;shown=c.frame;ctx.clearRect(0,0,416,416);ctx.save();ctx.translate(208,208);api.renderer.draw(ctx,c.frame,416);ctx.restore();slider.value=c.frame;status.textContent='Frame '+(c.frame+1)+' / 40';}play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play';};slider.oninput=()=>{playing=false;play.textContent='Play';c.elapsedMs=Number(slider.value)*250;c.frame=Number(slider.value);draw();};document.getElementById('background').onclick=e=>{const light=document.getElementById('stage').classList.toggle('light');e.currentTarget.textContent=light?'Dark background':'Light background';};function loop(now){if(playing)c.update(now-last);last=now;draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);});</script></body></html>
